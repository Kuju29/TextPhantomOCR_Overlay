<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>TextPhantom · Prompt Studio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="prompt.css" />
<link rel="stylesheet" href="../shared/ui-language.css" />
</head>

<body>
  <header class="ps-head">
    <a class="ps-title tp-brand-link" href="https://kuju29.com/" target="_blank" rel="noopener noreferrer" aria-label="TextPhantom website">
      <h1>Prompt Studio</h1>
      <span class="ps-sub">Set the AI translation prompt for each language</span>
    </a>
    <div data-tp-language-host></div>
    <div class="ps-head-actions">
      <span id="ps-status" class="ps-status" aria-live="polite"></span>
    </div>
  </header>

  <main class="ps-main">
    <aside class="ps-side">
      <div class="ps-field">
        <label for="ps-lang">Prompt language</label>
        <select id="ps-lang" data-tp-ui-private aria-label="Prompt language"></select>
      </div>
      <div class="ps-hint">Saved separately for this provider, model and language.</div>
      <div class="ps-actions">
        <button type="button" id="ps-load-default" class="ps-btn">Reload built-in style</button>
        <button type="button" id="ps-clear" class="ps-btn ghost">Clear</button>
      </div>

      <div class="ps-actions">
        <button type="button" id="ps-back" class="ps-btn" title="Back to the previous saved version">↶ Back</button>
        <button type="button" id="ps-forward" class="ps-btn" title="Forward to the next saved version">↷
          Forward</button>
      </div>

      <div class="ps-actions ps-actions-primary">
        <button type="button" id="ps-save" class="ps-btn primary">Save</button>
      </div>

      <div class="ps-note">
        The popup's "Set prompt" box edits this same value — this page is just a
        bigger workspace for long prompts.
      </div>
    </aside>

    <section class="ps-editor">
      <div class="ps-editor-bar">
        <span id="ps-key" data-tp-ui-private class="ps-key">en</span>
        <span id="ps-count" data-tp-ui-private class="ps-count">0</span>
      </div>
      <textarea id="ps-text" spellcheck="false"
        placeholder="Set translation instructions. Load the built-in default if this is empty."></textarea>
    </section>
  </main>

  <script src="../shared/compat.js"></script>
  <script type="module" src="../shared/ui-language-entry.js"></script>
<script type="module" src="prompt.js"></script>
</body>

</html>
