<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TextPhantom · Contact admin</title><link rel="stylesheet" href="../shared/theme.css"><link rel="stylesheet" href="../shared/ui-language.css"><link rel="stylesheet" href="chat.css"></head><body>
<section id="chat" aria-label="Contact admin">
<button id="minimized" type="button" aria-label="Open chat" title="Contact admin" hidden><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11a8 8 0 0 1-8 8H7l-5 3 2-6a8 8 0 0 1-1-5 9 9 0 0 1 18 0Z"/></svg><span id="unread" data-tp-ui-private></span></button>
<div id="preview" hidden><span class="preview-avatar" aria-hidden="true"><img src="../icons/48.png" alt=""></span><div class="preview-body"><strong>Admin replied</strong><p id="reply-preview" data-tp-ui-private></p><button id="preview-open" type="button">Open chat</button></div><button id="preview-dismiss" class="icon-button" type="button" aria-label="Dismiss notification" title="Dismiss notification"><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div id="expanded"><header class="chat-header">
<a class="chat-avatar" href="https://kuju29.com/" target="_blank" rel="noopener noreferrer" aria-label="TextPhantom website" title="TextPhantom website"><img src="../icons/48.png" alt=""><span class="presence-dot" aria-hidden="true"></span></a>
<div class="chat-title"><strong>Contact admin</strong><div id="presence" class="presence">Admin activity unavailable</div><div id="hours" class="hours" hidden></div></div>
<div class="header-actions">
<button id="account-toggle" class="icon-button" type="button" aria-label="Account" title="Account" aria-expanded="false" aria-controls="account-menu" hidden><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
<button id="minimize" class="icon-button" type="button" aria-label="Minimize chat" title="Minimize chat"><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
<button id="hide" class="icon-button" type="button" aria-label="Hide chat" title="Hide chat"><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>
<div id="account-menu" class="account-menu" hidden><p class="account-label">Signed in as</p><div id="identity" data-tp-ui-private></div><button id="signout" class="menu-item danger" type="button">Sign out of this account</button></div>
</header>
<div class="chat-status"><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="state"></span><button id="end" class="text-action" type="button" hidden>End chat</button></div>
<div hidden data-tp-language-host></div>

<form id="login" hidden><p>Sign in with your email.</p><label>Email<input id="email" type="email" required autocomplete="email" maxlength="254"></label><button id="request-code" type="button">Send code</button><label>Verification code<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button id="verify" type="submit">Verify & sign in</button><p class="hint">No email after a minute? Check your spam or junk folder.</p></form>
<div id="conversation" hidden><button id="older" type="button" hidden>Earlier messages</button><div id="history" role="log" aria-label="Conversation"></div>
<form id="compose"><div id="files" data-tp-ui-private></div><div class="composer"><label class="attach icon-button" title="Attach"><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 11-9 9a5 5 0 0 1-7-7l10-10a3 3 0 0 1 4 4L9 17a1 1 0 0 1-2-2l9-9"/></svg><span class="sr-only">Attach</span><input id="file" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.pdf,.zip"></label><label class="sr-only" for="text">Message</label><textarea id="text" title="Shift+Enter for a new line · Ctrl+V to attach" placeholder="Write a message…" rows="1" maxlength="5000"></textarea><button id="send" type="submit" title="Enter to send"><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg><span id="send-label" class="send-label">Send</span></button></div><p class="hint">Up to 6 attachments, 40 MB total per message.</p></form>
</div>
<p id="error" role="status" data-tp-ui-private></p></div>
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
<div class="lightbox-bar"><span id="lightbox-count" class="lightbox-count" data-tp-ui-private></span><span id="lightbox-name" class="lightbox-name" data-tp-ui-private></span><a id="lightbox-download" class="icon-button" href="#" download aria-label="Download image" title="Download image"><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg></a><button id="lightbox-close" class="icon-button" type="button" aria-label="Close image viewer" title="Close image viewer"><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div id="lightbox-stage" class="lightbox-stage"><img id="lightbox-image" alt="" data-tp-ui-private></div>
<button id="lightbox-prev" class="icon-button lightbox-nav prev" type="button" aria-label="Previous image" title="Previous image"><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
<button id="lightbox-next" class="icon-button lightbox-nav next" type="button" aria-label="Next image" title="Next image"><svg class="chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
</div></section>
<script src="../shared/compat.js"></script><script type="module" src="../shared/ui-language-entry.js"></script><script type="module" src="chat.js"></script></body></html>
